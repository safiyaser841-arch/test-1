
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WRONG ANSWER QUIZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>THE WRONG ANSWER QUIZ</h1>
        <p class="subtitle">EVERY ANSWER IS WRONG.</p>

        <h2 id="question">Are you ready?</h2>

        <div id="answers">
            <button onclick="startQuiz()">START QUIZ</button>
        </div>

        <p id="message"></p>

        <button id="restart" onclick="restartQuiz()">
            PLAY AGAIN
        </button>
    </main>

    <div id="monster">
        <img src="monster.jpg" alt="Scary monster">
        <h2>YOU ANSWERED WRONG!</h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
